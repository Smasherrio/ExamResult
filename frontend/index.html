<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamResult dApp</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>ExamResult DApp</h1>
      <p class="subtitle">Store and retrieve exam results on Stellar blockchain</p>
    </header>

    <nav class="wallet-nav">
      <div id="wallet-info" class="wallet-info hidden">
        <span class="wallet-label">Connected:</span>
        <span id="wallet-address" class="wallet-address"></span>
      </div>
      <button id="connect-wallet" class="btn btn-primary">Connect Wallet</button>
      <button id="disconnect-wallet" class="btn btn-secondary hidden">Disconnect</button>
    </nav>

    <main>
      <section id="add-result-section" class="card">
        <h2>Add Exam Result</h2>
        <form id="add-result-form">
          <div class="form-group">
            <label for="student-id">Student ID</label>
            <input type="text" id="student-id" placeholder="Enter student ID" required>
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" placeholder="e.g., Mathematics" required>
          </div>
          <div class="form-group">
            <label for="marks">Marks</label>
            <input type="number" id="marks" placeholder="0-100" min="0" max="100" required>
          </div>
          <button type="submit" class="btn btn-primary">Submit Result</button>
        </form>
        <div id="add-result-status" class="status-message hidden"></div>
      </section>

      <section id="get-result-section" class="card">
        <h2>Check Exam Result</h2>
        <form id="get-result-form">
          <div class="form-group">
            <label for="student-id-get">Student ID</label>
            <input type="text" id="student-id-get" placeholder="Enter student ID" required>
          </div>
          <div class="form-group">
            <label for="subject-get">Subject</label>
            <input type="text" id="subject-get" placeholder="e.g., Mathematics" required>
          </div>
          <button type="submit" class="btn btn-primary">Get Result</button>
        </form>
        <div id="result-display" class="result-display hidden">
          <h3>Result Found:</h3>
          <div id="result-data"></div>
        </div>
        <div id="get-result-status" class="status-message hidden"></div>
      </section>
    </main>

    <footer>
      <p>Network: <strong>Stellar Testnet</strong></p>
      <p>Contract: <span class="contract-id">•••••••••••••••••••••••••••</span></p>
    </footer>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
